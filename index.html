<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mohammed Hawaj — Brand & Graphic Designer</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      min-height: 100vh;
      padding: 40px 5vw;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.6s;
    }

    .hero-center {
      position: relative;
      z-index: 2;
    }

    .name-line {
      overflow: hidden;
      white-space: nowrap;
    }

    .name-line h1 {
      font-size: clamp(62px, 12vw, 190px);
      line-height: 0.82;
      letter-spacing: -0.075em;
      font-weight: 800;
      transform: translateY(120%);
    }

    .line-1 h1 {
      animation: slideUp 1.1s cubic-bezier(.16,1,.3,1) forwards;
      animation-delay: 0.25s;
    }

    .line-2 h1 {
      animation: slideUp 1.1s cubic-bezier(.16,1,.3,1) forwards;
      animation-delay: 0.55s;
    }

    .descriptor {
      margin-top: 35px;
      display: flex;
      gap: 14px;
      align-items: center;
      font-size: clamp(13px, 1.3vw, 18px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.5s;
    }

    .rotating-word {
      display: inline-block;
      min-width: 160px;
      font-weight: 700;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      opacity: 0;
      animation: fadeIn 1s ease forwards;
      animation-delay: 1.8s;
    }

    .scroll {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scroll-line {
      width: 55px;
      height: 1px;
      background: #f5f5f5;
      transform-origin: left;
      animation: pulseLine 1.5s ease-in-out infinite;
    }

    .blob {
      position: absolute;
      width: 420px;
      height: 420px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 50%;
      right: -120px;
      top: 18%;
      z-index: 0;
      transition: transform 0.15s ease-out;
    }

    .blob::before {
      content: "";
      position: absolute;
      inset: 45px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 50%;
    }

    .blob::after {
      content: "";
      position: absolute;
      inset: 95px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 50%;
    }

    @keyframes slideUp {
      from {
        transform: translateY(120%);
      }
      to {
        transform: translateY(0%);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulseLine {
      0%, 100% {
        transform: scaleX(0.35);
        opacity: 0.3;
      }
      50% {
        transform: scaleX(1);
        opacity: 1;
      }
    }

    @media (max-width: 768px) {
      .hero {
        padding: 28px 22px;
      }

      .name-line h1 {
        line-height: 0.88;
      }

      .descriptor {
        flex-wrap: wrap;
      }

      .bottom {
        gap: 20px;
      }

      .blob {
        width: 260px;
        height: 260px;
        right: -90px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }

      .name-line h1,
      .topbar,
      .descriptor,
      .bottom {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

<body>

  <section class="hero" id="hero">

    <div class="topbar">
      <span>Portfolio 2026</span>
      <span>Damascus / Syria</span>
    </div>

    <div class="hero-center">
      <div class="name-line line-1">
        <h1>MOHAMMED</h1>
      </div>

      <div class="name-line line-2">
        <h1>HAWAJ</h1>
      </div>

      <div class="descriptor">
        <span>Brand & Graphic Designer</span>
        <span>—</span>
        <span class="rotating-word" id="rotatingWord">BRANDING</span>
      </div>
    </div>

    <div class="bottom">
      <span>Selected Work</span>

      <div class="scroll">
        <span>Scroll</span>
        <div class="scroll-line"></div>
      </div>
    </div>

    <div class="blob" id="blob"></div>

  </section>

  <script>
    const words = [
      "BRANDING",
      "RETAIL DESIGN",
      "VISUAL IDENTITY",
      "PRINT",
      "ENVIRONMENTAL"
    ];

    const rotatingWord = document.getElementById("rotatingWord");
    const blob = document.getElementById("blob");
    const hero = document.getElementById("hero");

    let wordIndex = 0;

    setInterval(() => {
      rotatingWord.animate(
        [
          { opacity: 1, transform: "translateY(0)" },
          { opacity: 0, transform: "translateY(-12px)" }
        ],
        {
          duration: 250,
          easing: "ease",
          fill: "forwards"
        }
      ).onfinish = () => {
        wordIndex = (wordIndex + 1) % words.length;
        rotatingWord.textContent = words[wordIndex];

        rotatingWord.animate(
          [
            { opacity: 0, transform: "translateY(12px)" },
            { opacity: 1, transform: "translateY(0)" }
          ],
          {
            duration: 350,
            easing: "ease",
            fill: "forwards"
          }
        );
      };
    }, 1900);

    hero.addEventListener("mousemove", (e) => {
      const rect = hero.getBoundingClientRect();

      const x = (e.clientX - rect.left) / rect.width - 0.5;
      const y = (e.clientY - rect.top) / rect.height - 0.5;

      blob.style.transform =
        `translate(${x * 45}px, ${y * 45}px)`;
    });

    hero.addEventListener("mouseleave", () => {
      blob.style.transform = "translate(0, 0)";
    });
  </script>

</body>
</html>
